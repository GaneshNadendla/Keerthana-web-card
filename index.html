<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hi Keerthana</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #f8cdda, #1d2b64);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      max-width: 90%;
    }
    h1 {
      font-size: 2.5rem;
      animation: glow 2s ease-in-out infinite alternate;
    }
    p {
      font-size: 1.2rem;
      margin-top: 20px;
    }
    @keyframes glow {
      from {
        text-shadow: 0 0 10px #fff, 0 0 20px #f0f, 0 0 30px #f0f;
      }
      to {
        text-shadow: 0 0 20px #fff, 0 0 30px #f0f, 0 0 40px #f0f;
      }
    }
    .btn {
      margin-top: 30px;
      padding: 12px 24px;
      background-color: #ffffff33;
      border: none;
      border-radius: 30px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s;
    }
    .btn:hover {
      background-color: #ffffff55;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hi Keerthana!</h1>
    <p>This is Ganesh Nadendla. Just wanted to say…</p>
    <p><strong>You’re truly special to me.</strong></p>
    <a class="btn" href="https://wa.me/918978565397?text=Hi%20Ganesh!" target="_blank">Send a reply to Ganesh</a>
  </div>
</body>
</html>
